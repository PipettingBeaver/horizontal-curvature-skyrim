name: "Fork Build"

on:
    workflow_dispatch:
    push:
        branches:
            - horizontal-curvature
            - "feat/**"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        uses: ./.github/workflows/_shared-build.yaml
        with:
            ref: ${{ github.ref }}
            repository: ${{ github.repository }}
            run-cpp: true
            run-shader-validation: true
            # PR keeps the full AIO artifact but skips LTCG; faster dev iterations.
            cmake-preset: PR
            cache-key-suffix: fork-pr
